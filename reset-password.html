<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TrustLink Escrow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236C4CF1'/%3E%3Cstop offset='1' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='10' y='10' width='12' height='12' rx='3' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <!-- Left Section - Illustration & Branding -->
        <div class="auth-left">
            <div class="auth-left-content">
                <!-- Escrow Illustration Placeholder (Shield/Lock) -->
                <svg class="auth-illustration" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
                            <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.5" />
                        </linearGradient>
                    </defs>
                    <path d="M200 40 L100 80 L100 160 C100 230 140 280 200 310 C260 280 300 230 300 160 L300 80 Z" fill="url(#shieldGrad)" />
                    <circle cx="200" cy="160" r="40" fill="#6C4CF1" />
                    <!-- Keyhole symbol -->
                    <circle cx="200" cy="150" r="12" fill="#FFFFFF" />
                    <path d="M192 160 L208 160 L212 185 L188 185 Z" fill="#FFFFFF" />
                    <rect x="50" y="200" width="80" height="20" rx="10" fill="#FFFFFF" opacity="0.6" />
                    <rect x="280" y="100" width="60" height="20" rx="10" fill="#FFFFFF" opacity="0.6" />
                </svg>
                
                <h2>Account Recovery</h2>
                <p>Lost access? We'll help you securely get back into your TrustLink account.</p>
            </div>
        </div>

        <!-- Right Section - Auth Form -->
        <div class="auth-right">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="index.html" class="auth-logo">
                        <div class="auth-logo-icon">
                            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </div>
                        TrustLink
                    </a>
                    <h1>Reset Password</h1>
                    <p>Enter your email and we'll send a reset link</p>
                </div>

                <form class="auth-form" action="#">
                    <div class="form-group">
                        <label for="reset-email">Email Address</label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            <input type="email" id="reset-email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn-primary" style="margin-top: 16px;">Send Reset Link</button>
                </form>

                <div class="auth-footer" style="margin-top: 32px;">
                    Remembered your password? <a href="login.html">Sign In &rarr;</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="auth-handler.js"></script>
</body>
</html>
