<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TrustLink Escrow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%2306B6D4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='10' y='10' width='12' height='12' rx='3' fill='white'/%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <!-- SEO Metadata -->
    <meta name="description" content="TrustLink Escrow: Secure asynchronous escrow platform for social media vendors. Create secure payment links for safe commerce.">
    <meta property="og:title" content="TrustLink Escrow - Secure Social Commerce">
</head>

<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="marketing-text">
                <h1>Control Everything in One Place</h1>
                <p style="color: #9CA3AF; font-size: 1.1rem; max-width: 360px; margin: 0 auto; line-height: 1.6;">
                    Secure escrow, seamless payments, and trusted transactions for social commerce.
                </p>
            </div>
        </div>
        <div class="auth-right">
            
            <div class="mobile-header">
                <div class="logo-text">TrustLink</div>
            </div>

            <div class="form-card">
                <div class="auth-form-container">
                    
                    <div class="desktop-logo">TrustLink</div>

                    <h2>Reset Password</h2>
                    <p style="color: #6B7280; font-size: 0.95rem; text-align: center; margin-bottom: 32px; line-height: 1.5;">
                        Enter your email address and we'll send you a link to reset your password.
                    </p>

                    <form class="auth-form reset-form" action="#" id="reset-form">
                        
                        <div class="form-group">
                            <label for="reset-email">Email Address</label>
                            <input type="email" id="reset-email" placeholder="example@email.com" required>
                        </div>
                        
                        <button type="submit" class="btn auth-btn" style="margin-top: 16px;">Send Reset Link</button>
                        
                    </form>

                    <div class="auth-switch" style="margin-top: 32px;">
                        Remembered your password? <a href="login.html">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="auth-handler.js"></script>
</body>

</html>
