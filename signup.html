<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TrustLink Escrow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%2306B6D4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='10' y='10' width='12' height='12' rx='3' fill='white'/%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <!-- SEO Metadata -->
    <meta name="description" content="TrustLink Escrow: Secure asynchronous escrow platform for social media vendors. Create secure payment links for safe commerce.">
    <meta property="og:title" content="TrustLink Escrow - Secure Social Commerce">
</head>

<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="marketing-text">
                <h1>Control Everything in One Place</h1>
                <p style="color: #9CA3AF; font-size: 1.1rem; max-width: 360px; margin: 0 auto; line-height: 1.6;">
                    Secure escrow, seamless payments, and trusted transactions for social commerce.
                </p>
            </div>
        </div>
        <div class="auth-right">
            
            <div class="mobile-header">
                <img src="img/logo.png" alt="TrustLink" style="height: 100px; width: auto; object-fit: contain;">
            </div>

            <div class="form-card">
                <div class="auth-form-container">
                    
                    <div class="desktop-logo" style="margin-bottom: 16px;">
                        <img src="img/logo.png" alt="TrustLink" style="height: 120px; width: auto; object-fit: contain;">
                    </div>

                    <h2>Create an Account?</h2>

                    <form class="auth-form" action="#" id="signup-form">
                        
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" placeholder="John Doe" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="example@email.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="password" placeholder="••••••••" required>
                                <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px;">
                                      <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" required>
                                <span>I agree to the Terms of Service</span>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn auth-btn">Create account</button>
                        
                    </form>

                    <div class="auth-divider">Or Sign in with</div>
                    
                    <div class="social-login-row">
                        <!-- Google -->
                        <button type="button" class="social-btn" id="google-auth-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512" style="width: 22px; height: 22px;">
                                <path fill="#4285F4" d="M486.76 240.67c0-16.14-1.39-31.78-4.08-47.01H248v89.28h134.46c-5.83 28.79-22.11 53.2-46.7 69.69v57.85h75.52c44.22-40.73 69.48-100.74 69.48-169.81z"/>
                                <path fill="#34A853" d="M248 488c67.24 0 123.69-22.36 164.98-60.52l-75.52-57.85c-22.36 14.97-51.13 23.86-89.46 23.86-68.79 0-126.96-46.46-147.78-109.11H21.57v59.83C63.15 426.68 148.51 488 248 488z"/>
                                <path fill="#FBBC05" d="M100.22 284.38c-5.32-15.93-8.32-33.02-8.32-50.38s3-34.45 8.32-50.38V123.79H21.57C7.88 150.98 0 181.76 0 214s7.88 63.02 21.57 90.21l78.65-19.83z"/>
                                <path fill="#EA4335" d="M248 95.8c36.59 0 69.46 12.63 95.31 37.38l71.49-71.49C371.59 23.47 315.15 0 248 0 148.51 0 63.15 61.32 21.57 143.79l78.65 59.83c20.82-62.65 78.99-107.82 147.78-107.82z"/>
                            </svg>
                        </button>
                    </div>

                    <div class="auth-switch">
                        Already have an account? <a href="login.html">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="auth-handler.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px;">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px;">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>`;
            }
        }
    </script>

</body>

</html>
